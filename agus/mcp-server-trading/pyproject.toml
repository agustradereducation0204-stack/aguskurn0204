[project]
name = "mt5-trading-mcp"
version = "0.1.0"
description = "MCP server untuk MetaTrader 5: data pasar, indikator, manajemen posisi & eksekusi order dengan pengaman."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mt5-trading-mcp = "mt5_trading_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mt5_trading_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
